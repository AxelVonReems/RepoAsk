[project]
name = "rag"
version = "0.1.0"
description = "RepoAsk RAG: indexes GitHub READMEs and answers questions with cited sources"
readme = "README.md"
authors = [
    { name = "axelvonreems", email = "axelvonreems@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

# Package lives in rag/ at the repo root, not src/rag/ (ingest/ already has its own src/)
[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

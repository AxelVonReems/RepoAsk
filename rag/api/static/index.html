<!doctype html>
<!--
  Demo page for the API, served by FastAPI at /. One file, no build step, no dependencies:
  it calls POST /ask and GET /health on the same origin, so no CORS setup is needed.
  Answers are built from README text anyone can write, so they are escaped before any formatting
  is added (see renderAnswer); nothing from the API is inserted as raw HTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoAsk</title>
  <meta name="description" content="Ask questions about the READMEs of the 1,000 most-starred GitHub repositories.">
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1a1d23;
      --muted: #5f6672;
      --border: #e1e4e9;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --ok: #15803d;
      --warn: #b45309;
      --error: #b91c1c;
      --radius: 12px;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px rgb(0 0 0 / 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --text: #e7e9ee;
        --muted: #9aa1ad;
        --border: #2a2f3a;
        --accent: #8b85ff;
        --accent-soft: #1f1d3a;
        --ok: #4ade80;
        --warn: #fbbf24;
        --error: #f87171;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
    header h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    header p { margin: 6px 0 0; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
              font-size: 0.85rem; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .dot.ok { background: var(--ok); }
    .dot.error { background: var(--error); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 20px; margin-top: 24px; }
    .label { margin: 0 0 10px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
             letter-spacing: 0.06em; color: var(--muted); }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; }
    .examples button { border: 1px solid var(--border); background: var(--bg); color: var(--text);
                       border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 0.9rem;
                       cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .examples button:hover { border-color: var(--accent); background: var(--accent-soft); }

    form { display: flex; gap: 8px; margin-top: 16px; }
    input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg); color: var(--text); padding: 10px 14px; font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .send { border: 0; border-radius: 10px; background: var(--accent); color: #fff;
            padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: wait; }

    .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-text { color: var(--error); margin: 0; }

    .question { margin: 0 0 12px; font-weight: 600; }
    .answer p { margin: 0 0 10px; }
    .answer ul { margin: 0 0 10px; padding-left: 20px; }
    .answer code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
                   padding: 0 4px; font-size: 0.9em; }
    .cite { color: var(--accent); text-decoration: none; font-size: 0.8em; vertical-align: super; }
    .meta { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }

    .sources { display: grid; gap: 10px; margin-top: 12px; }
    .source { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; scroll-margin: 16px; }
    .source:target { border-color: var(--accent); background: var(--accent-soft); }
    .source-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .source a { color: var(--text); font-weight: 600; text-decoration: none; }
    .source a:hover { color: var(--accent); }
    .source small { color: var(--muted); }
    .source p { margin: 6px 0 0; font-size: 0.9rem; color: var(--muted); }

    footer { margin-top: 40px; font-size: 0.85rem; color: var(--muted); text-align: center; }
    footer a { color: var(--muted); }
    @media (max-width: 520px) { form { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Repo<span>Ask</span></h1>
    <p>Ask about the READMEs of the most-starred GitHub repositories. Answers cite their sources.</p>
    <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">Connecting…</span></div>
  </header>

  <section class="card">
    <p class="label">Try a question</p>
    <div class="examples" id="examples"></div>
    <form id="ask-form">
      <input id="question" name="question" type="text" minlength="3" maxlength="500" required
             placeholder="Or ask your own, e.g. Which tools help me manage dotfiles?" autocomplete="off">
      <button class="send" id="send" type="submit">Ask</button>
    </form>
  </section>

  <section class="card" id="result" hidden></section>

  <footer>
    Retrieval with bge-small embeddings, answers by Gemini ·
    <a href="/docs">API docs</a> ·
    <a href="https://github.com/AxelVonReems/RepoAsk">Source on GitHub</a>
  </footer>
</main>

<script>
  // Picked from the eval set: each one retrieves its repo; the last shows the refusal path
  const EXAMPLES = [
    "Is there an interactive fuzzy finder for the terminal?",
    "Which fast, GPU-accelerated terminal emulators are there?",
    "What can I use to download videos from YouTube on the command line?",
    "I need a whiteboard app for drawing sketchy-looking diagrams.",
    "Which open-source platform can control my smart home devices locally?",
    "How do I bake sourdough bread at home?",
  ];
  // The server scales to zero when idle; waking it takes ~25 s, so say so instead of looking stuck
  const COLD_START_HINT_MS = 3000;
  const REQUEST_TIMEOUT_MS = 90000;

  const $ = (id) => document.getElementById(id);
  const form = $("ask-form"), input = $("question"), send = $("send"), result = $("result");

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // A tiny Markdown subset: escape first, then add only the tags we create ourselves
  function inline(text, sourceCount) {
    return escapeHtml(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d+)\]/g, (match, n) =>
        Number(n) >= 1 && Number(n) <= sourceCount ? `<a class="cite" href="#source-${n}">[${n}]</a>` : match);
  }

  function renderAnswer(text, sourceCount) {
    const html = [];
    let list = [];
    const flush = () => { if (list.length) { html.push(`<ul>${list.join("")}</ul>`); list = []; } };
    for (const line of text.split("\n")) {
      const item = line.match(/^\s*[*-]\s+(.*)/);
      if (item) { list.push(`<li>${inline(item[1], sourceCount)}</li>`); continue; }
      flush();
      if (line.trim()) html.push(`<p>${inline(line, sourceCount)}</p>`);
    }
    flush();
    return html.join("");
  }

  // Snippets are raw README Markdown: drop heading, emphasis and code markers for display
  const plainText = (text) => text.replace(/[#*_`>]+/g, "").replace(/\s+/g, " ").trim();

  // Escaping stops a URL from breaking out of the attribute; this also rules out javascript: links
  const safeUrl = (url) => (/^https:\/\//.test(url) ? escapeHtml(url) : "#");

  function renderSources(sources) {
    return sources.map((s) => `
      <div class="source" id="source-${s.n}">
        <div class="source-head">
          <a href="${safeUrl(s.url)}" target="_blank" rel="noopener">[${s.n}] ${escapeHtml(s.full_name)}</a>
          <small>★ ${s.stars.toLocaleString("en")} · score ${s.score.toFixed(2)}</small>
        </div>
        <p>${s.heading ? `<strong>${escapeHtml(s.heading)}</strong> · ` : ""}${escapeHtml(plainText(s.snippet))}</p>
      </div>`).join("");
  }

  function show(html) { result.hidden = false; result.innerHTML = html; }

  function setBusy(busy) {
    send.disabled = busy;
    document.querySelectorAll(".examples button").forEach((b) => (b.disabled = busy));
  }

  async function errorMessage(response) {
    let detail = "";
    try { detail = (await response.json()).detail; } catch { /* not JSON */ }
    if (response.status === 422) return "Questions need between 3 and 500 characters.";
    if (typeof detail === "string" && detail) return detail;
    return `The server answered with an error (${response.status}).`;
  }

  async function ask(question) {
    question = question.trim();
    if (question.length < 3) return;
    input.value = question;
    setBusy(true);
    show(`<div class="loading"><div class="spinner"></div><span id="loading-text">Searching the READMEs…</span></div>`);
    const hint = setTimeout(() => {
      const el = $("loading-text");
      if (el) el.textContent = "Waking up the server (it sleeps when idle to stay free). This can take up to 30 seconds…";
    }, COLD_START_HINT_MS);

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
        signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
      });
      if (!response.ok) throw new Error(await errorMessage(response));
      const data = await response.json();
      const sources = data.sources.length
        ? `<p class="label" style="margin-top:20px">Sources</p><div class="sources">${renderSources(data.sources)}</div>`
        : "";
      show(`
        <p class="question">${escapeHtml(question)}</p>
        <div class="answer">${renderAnswer(data.answer, data.sources.length)}</div>
        ${sources}
        <div class="meta">${data.sources.length
          ? `Answered by ${escapeHtml(data.model)}`
          : "No README section scored high enough, so the LLM was not called"}</div>`);
      result.scrollIntoView({ behavior: "smooth", block: "start" });
      setStatus("ok");
    } catch (error) {
      const message = error.name === "TimeoutError" ? "The request timed out. Please try again." : error.message;
      show(`<p class="error-text">${escapeHtml(message)}</p>`);
    } finally {
      clearTimeout(hint);
      setBusy(false);
    }
  }

  let health = null;
  function setStatus(state) {
    $("status-dot").className = "dot " + (state === "ok" ? "ok" : state === "error" ? "error" : "");
    $("status-text").textContent =
      state === "ok" && health
        ? `Ready · ${health.repos.toLocaleString("en")} repos, ${health.chunks.toLocaleString("en")} chunks · index updated ${health.index_age_days ?? "?"} days ago`
        : state === "error" ? "Server unavailable, try again in a minute" : "Waking up the server…";
  }

  // Opening the page already starts the server, so it's often awake by the first question
  async function loadHealth() {
    const slow = setTimeout(() => setStatus("waking"), COLD_START_HINT_MS);
    try {
      const response = await fetch("/health", { signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS) });
      if (!response.ok) throw new Error();
      health = await response.json();
      setStatus("ok");
    } catch {
      setStatus("error");
    } finally {
      clearTimeout(slow);
    }
  }

  for (const text of EXAMPLES) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", () => ask(text));
    $("examples").append(button);
  }
  form.addEventListener("submit", (event) => { event.preventDefault(); ask(input.value); });
  loadHealth();
</script>
</body>
</html>
